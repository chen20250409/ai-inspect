# =====================================================================
# Nginx 反向代理配置（AI 视觉质检系统）
# 容器内路径：/etc/nginx/nginx.conf
# 作用：统一入口，对外只暴露 80 端口，隐藏后端 FastAPI 的 8000 端口
# =====================================================================
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # 压缩，减小 JSON 响应体积
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml image/svg+xml;

    # -----------------------------------------------------------------
    # 使用 Docker 内置 DNS 做「运行时动态解析」
    #
    # 踩坑记录：如果写成 upstream fastapi_backend { server fastapi-ai:8000; }
    # Nginx 只在【启动那一刻】把容器名解析成 IP 并永久缓存。一旦后端容器
    # 被 docker rm / 重建，IP 变了，Nginx 依然往旧 IP 发请求 —— 页面直接 502。
    # 解决办法：用 resolver 指向 Docker 内置 DNS，并在 proxy_pass 里用变量，
    # 这样每次请求（或缓存过期后）都会重新解析容器名。
    # -----------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen       80;
        server_name  _;

        charset utf-8;

        # 上传图片，Nginx 默认上限只有 1M，必须放开，否则大图直接 413
        client_max_body_size 20m;

        # 后端地址：同一个 ai-net 网络里，容器名 fastapi-ai 就是域名，
        # 绝对不能写 127.0.0.1 —— 那指向的是 Nginx 自己这个容器。
        set $backend "http://fastapi-ai:8000";

        # -------------------------------------------------------------
        # 1) 静态原图：Nginx 直接读共享数据卷返回，不消耗后端资源
        #    访问 http://<IP>/static/defect01.jpg
        # -------------------------------------------------------------
        location /static/ {
            alias        /usr/share/nginx/html/static/;
            expires      1h;
            add_header   Cache-Control "public";
            autoindex    off;
            try_files    $uri =404;
        }

        # -------------------------------------------------------------
        # 2) 带 /api 前缀的请求：剥掉前缀再转发给后端
        #    例：/api/health  ->  fastapi-ai:8000/health
        # -------------------------------------------------------------
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # -------------------------------------------------------------
        # 3) 其余请求原样转发：/health  /records  /upload  /  /docs
        # -------------------------------------------------------------
        location / {
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
        }

        # -------------------------------------------------------------
        # 4) Nginx 自身健康检查（不经过后端）
        # -------------------------------------------------------------
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "nginx ok\n";
        }
    }
}
